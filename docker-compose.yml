version: "3.8"

services:
  ocr-api:
    build: .
    container_name: ocr-service
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # 持久化上传和输出目录
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      # 可选：挂载配置文件
      #- ./config.yaml:/app/config.yaml:ro
    environment:
      # 覆盖默认配置（可选）
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OCR_DEFAULT_ENGINE=${OCR_DEFAULT_ENGINE:-paddle}
      - DEBUG=${DEBUG:-false}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s  # PaddleOCR 首次加载模型需要时间
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G        # PaddleOCR 内存占用较高
          cpus: "2"
        reservations:
          memory: 2G
